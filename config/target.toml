# ---- Allowed projects ------------------------------------------------------
# The harness only works on projects listed here. A task file names its
# project, and a run is refused unless that project is in this list.

[projects.cosmicpython]
url = "https://github.com/cosmicpython/code.git"
commit = "14c84797ffa77255d53cf1a02fe6aafda2b68aeb"   # exact starting commit
pristine = "workspace/target-pristine"   # clean clone: python -m harness fetch cosmicpython
image = "cosmic-sandbox"                 # sandbox image with this project's dependencies

# The only commands that can run in this project's sandbox, by name.
[projects.cosmicpython.checks]
unit_tests = ["pytest", "tests/unit", "-q", "-p", "no:cacheprovider"]
acceptance = ["pytest", "/acceptance", "-q", "-p", "no:cacheprovider"]
# Integration tests that use an in-memory SQLite database: repository, unit of
# work and the read model, through the real SQLAlchemy mapping. They need no
# Postgres, Redis or network. The one Postgres test (concurrent updates) is
# left out by name; it would wait 10 s for a database and then fail.
integration_sqlite = [
    "pytest",
    "tests/integration/test_repository.py",
    "tests/integration/test_uow.py",
    "tests/integration/test_views.py",
    "-q", "-p", "no:cacheprovider",
    "-k", "not test_concurrent_updates_to_version_are_not_allowed",
]

# ---- Shared by all projects -----------------------------------------------

# Resources for every sandbox container (the image is set per project).
[sandbox]
timeout_seconds = 120
memory = "1g"
cpus = "1"
max_output_chars = 8000

[limits]
max_actions = 30            # tool calls per run
max_denied_actions = 10     # refused or failed tool calls per run
max_retries = 3             # replies in a row without a usable tool call
max_tool_output_chars = 6000

# What is sent to the model per request (see "Context" in the README).
[context]
max_tokens = 24000          # size limit per request incl. tool definitions, about 3 characters
                            # per token; must stay below 90% of num_ctx
keep_recent_results = 6     # the newest tool results stay in full unless the limit cannot
                            # be met otherwise
repo_map_chars = 3000       # repository map in the first message
selected_files = 4          # files whose outline the harness adds to the first message
selected_chars = 4000       # for those outlines together

[model]
host = "http://localhost:11434"
name = "qwen3.6:35b"
think = true                # let the model reason before answering (slower, usually better)
num_ctx = 32768             # context window in tokens; Ollama's default is smaller
timeout_seconds = 600       # per model reply; the first reply also loads the model
